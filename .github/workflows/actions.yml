name: run forecastedr_script.py

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

concurrency:
  group: hourly-fetch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./script
    steps:

      - name: checkout repo content
        uses: actions/checkout@v4 # checkout the repository content

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # install the python version needed

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: execute py script # run main.py
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
        run: python forecastedr_script_DINI.py

      - name: fetch wind actuals
        run: python elec_map_script.py --output wind_actuals.json

      - name: commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || git commit -m "updated logs"
          # rebase on anything pushed while this run was in flight, then push
          git pull --rebase origin main
          git push origin HEAD:main
